spring.application.name=rental-backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/rental;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/css,text/javascript,application/javascript,text/html,image/svg+xml
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=100
server.tomcat.accept-count=100
server.tomcat.max-http-form-post-size=1MB
server.max-http-request-header-size=16KB
spring.web.resources.cache.cachecontrol.no-cache=true
spring.h2.console.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/swagger-ui.html
app.deposit-percent=30
app.token-ttl-days=7
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=6MB
server.error.include-stacktrace=never
server.error.include-message=never
